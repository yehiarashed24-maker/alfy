<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="Y ❤️ A"/>
    <meta name="theme-color" content="#fff0f5"/>
    <title>Y ❤️ A - حديقة بوابات الذكريات 360°</title>
    <script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600&family=Playfair+Display:wght@500;600;700&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
          theme: {
            extend: {
              "colors": {
                      "background": "#fff0f5",
                      "surface-dim": "#fce7f3",
                      "secondary": "#a43073",
                      "secondary-container": "#fc79bd",
                      "primary": "#765469",
                      "primary-container": "#fbcfe8",
                      "on-background": "#2c1325",
                      "surface-variant": "#ffd8e7"
              },
              "fontFamily": {
                      "headline-lg": ["Playfair Display", "Cairo", "serif"],
                      "headline-md": ["Playfair Display", "Cairo", "serif"],
                      "display-lg": ["Playfair Display", "Cairo", "serif"],
                      "cairo": ["Cairo", "sans-serif"],
                      "tajawal": ["Tajawal", "sans-serif"]
              }
            }
          }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at 50% 30%, #ffd8e7 0%, #fff0f5 45%, #fce7f3 100%) !important;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        #timeline-rotunda-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: grab;
        }
        #timeline-rotunda-canvas:active {
            cursor: grabbing;
        }

        /* 3D Gate Button */
        .gate-dock-btn {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1.5px solid rgba(244, 114, 182, 0.5);
            color: #765469;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .gate-dock-btn:hover, .gate-dock-btn.active {
            background: linear-gradient(135deg, #a43073 0%, #ec4899 100%);
            color: #ffffff;
            border-color: #ec4899;
            transform: translateY(-6px) scale(1.08);
            box-shadow: 0 10px 25px -4px rgba(164, 48, 115, 0.4), 0 0 15px rgba(244, 114, 182, 0.5);
        }

        /* Memory Overlay Modal */
        #gate-memory-overlay {
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #gate-memory-overlay.hidden-overlay {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.9) translateY(40px);
        }
        #gate-memory-overlay.visible-overlay {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1) translateY(0);
        }

        .pulse-portal {
            animation: portalGlow 2.5s ease-in-out infinite;
        }
        @keyframes portalGlow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(244, 114, 182, 0.6)); }
            50% { filter: drop-shadow(0 0 25px rgba(236, 72, 153, 0.95)); }
        }
    </style>
</head>
<body class="text-on-background font-body-lg relative min-h-screen select-none flex flex-col justify-between">

<!-- 3D Rose Rotunda Canvas (360 Garden Engine) -->
<canvas id="timeline-rotunda-canvas"></canvas>

<!-- TopNavBar -->
<header class="bg-[#fff0f5]/80 backdrop-blur-md fixed top-0 w-full z-50 border-b border-[#fbcfe8]/70 shadow-sm shadow-secondary/10">
    <div class="max-w-6xl mx-auto px-6 h-20 flex justify-between items-center">
        <a href="index.html" class="font-headline-md text-2xl md:text-3xl text-primary font-bold tracking-wider hover:opacity-90 transition-opacity flex items-center gap-1.5">
            <span>Y</span><span class="text-secondary text-2xl md:text-3xl animate-pulse inline-block">❤️</span><span>A</span>
        </a>
        <nav class="hidden md:flex items-center gap-6">
            <a class="text-on-surface-variant hover:text-primary transition-colors hover:bg-primary-container/20 rounded-full px-4 py-2" href="index.html">Home</a>
            <a class="text-secondary border-b-2 border-secondary pb-1 hover:bg-primary-container/20 rounded-full px-4 py-2 font-bold" href="timeline.html">Timeline</a>
            <a class="text-on-surface-variant hover:text-primary transition-colors hover:bg-primary-container/20 rounded-full px-4 py-2" href="gallery.html">Gallery</a>
            <a class="text-on-surface-variant hover:text-primary transition-colors hover:bg-primary-container/20 rounded-full px-4 py-2 font-cairo" href="letter.html">رسالة</a>
        </nav>
        <a href="timeline.html" class="text-primary font-cairo text-sm hover:bg-primary-container/20 rounded-full px-6 py-2 border border-secondary/30 hidden md:inline-block font-bold">
            حديقة بوابات 360° ♡
        </a>
        <!-- Mobile Menu Toggle -->
        <button class="md:hidden text-primary p-2" onclick="document.getElementById('mobile-menu').classList.toggle('hidden')">
            <span class="material-symbols-outlined">menu</span>
        </button>
    </div>
    <!-- Mobile Menu dropdown -->
    <div id="mobile-menu" class="hidden md:hidden bg-[#fff0f5]/95 backdrop-blur-md border-b border-[#fbcfe8]/70 px-6 py-4 flex flex-col gap-2">
        <a class="text-on-surface-variant hover:text-primary px-4 py-2 rounded-lg" href="index.html">Home</a>
        <a class="text-secondary font-bold px-4 py-2 rounded-lg bg-primary-container/20" href="timeline.html">Timeline</a>
        <a class="text-on-surface-variant hover:text-primary px-4 py-2 rounded-lg" href="gallery.html">Gallery</a>
        <a class="text-on-surface-variant hover:text-primary px-4 py-2 rounded-lg font-cairo" href="letter.html">رسالة</a>
    </div>
</header>

<!-- Garden Top HUD Prompt -->
<div class="fixed top-24 left-1/2 -translate-x-1/2 z-20 text-center pointer-events-none w-full px-4">
    <div class="inline-flex items-center gap-2 bg-white/75 backdrop-blur-md text-secondary px-6 py-2.5 rounded-full text-xs sm:text-sm font-cairo font-bold shadow-md border border-[#f472b6]/50 pulse-portal">
        <span class="material-symbols-outlined text-sm">360</span>
        <span>اسحبي يمين وشمال لتلفي في الحديقة.. واضغطي على أي بوابة لتدخلي جواها ♡</span>
    </div>
</div>

<!-- 360 Rotation Arrow Shortcuts (Desktop & Mobile) -->
<div class="fixed inset-y-0 left-4 z-20 flex items-center pointer-events-none">
    <button onclick="rotateGardenBy(-0.4)" class="pointer-events-auto w-12 h-12 rounded-full bg-white/80 backdrop-blur-md border border-[#f472b6]/60 text-secondary flex items-center justify-center shadow-lg hover:scale-110 active:scale-95 transition-all">
        <span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
    </button>
</div>
<div class="fixed inset-y-0 right-4 z-20 flex items-center pointer-events-none">
    <button onclick="rotateGardenBy(0.4)" class="pointer-events-auto w-12 h-12 rounded-full bg-white/80 backdrop-blur-md border border-[#f472b6]/60 text-secondary flex items-center justify-center shadow-lg hover:scale-110 active:scale-95 transition-all">
        <span class="material-symbols-outlined text-2xl">arrow_forward_ios</span>
    </button>
</div>

<!-- Bottom Gate Selection Bar -->
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-30 w-full max-w-xl px-4">
    <div class="flex items-center justify-center gap-2 sm:gap-3 p-2 rounded-3xl bg-white/60 backdrop-blur-xl border border-[#fbcfe8] shadow-xl shadow-secondary/15">
        <button onclick="selectGate(0)" class="gate-dock-btn active flex-1 py-2.5 px-2 rounded-2xl flex flex-col items-center justify-center gap-1 font-cairo text-xs font-bold" id="dock-gate-0">
            <span class="text-base">🍝</span>
            <span>2022</span>
        </button>
        <button onclick="selectGate(1)" class="gate-dock-btn flex-1 py-2.5 px-2 rounded-2xl flex flex-col items-center justify-center gap-1 font-cairo text-xs font-bold" id="dock-gate-1">
            <span class="text-base">🌸</span>
            <span>2023</span>
        </button>
        <button onclick="selectGate(2)" class="gate-dock-btn flex-1 py-2.5 px-2 rounded-2xl flex flex-col items-center justify-center gap-1 font-cairo text-xs font-bold" id="dock-gate-2">
            <span class="text-base">🩺</span>
            <span>2024</span>
        </button>
        <button onclick="selectGate(3)" class="gate-dock-btn flex-1 py-2.5 px-2 rounded-2xl flex flex-col items-center justify-center gap-1 font-cairo text-xs font-bold" id="dock-gate-3">
            <span class="text-base">🌙</span>
            <span>2025</span>
        </button>
        <button onclick="selectGate(4)" class="gate-dock-btn flex-1 py-2.5 px-2 rounded-2xl flex flex-col items-center justify-center gap-1 font-cairo text-xs font-bold" id="dock-gate-4">
            <span class="text-base">❤️</span>
            <span>2026</span>
        </button>
    </div>
</div>

<!-- Inside-The-Gate Memory Overlay Stage -->
<div id="gate-memory-overlay" class="hidden-overlay fixed inset-0 z-40 bg-black/40 backdrop-blur-md flex items-center justify-center p-4 sm:p-6">
    <div class="bg-gradient-to-br from-white/95 to-[#fff0f5]/90 border-2 border-[#f472b6] shadow-2xl rounded-3xl max-w-2xl w-full p-6 sm:p-8 relative max-h-[85vh] overflow-y-auto" dir="rtl">
        
        <!-- Close / Walk Back Button -->
        <button onclick="exitGateWalk()" class="absolute top-4 left-4 w-10 h-10 rounded-full bg-primary-container text-secondary flex items-center justify-center hover:bg-secondary hover:text-white transition-colors shadow-sm">
            <span class="material-symbols-outlined">close</span>
        </button>

        <!-- Memory Content Target -->
        <div id="overlay-memory-body">
            <!-- Dynamic Content Injected by JS -->
        </div>

        <!-- Back to Garden Center CTA -->
        <div class="mt-6 pt-4 border-t border-[#fbcfe8] flex flex-col sm:flex-row items-center justify-between gap-3">
            <button onclick="exitGateWalk()" class="w-full sm:w-auto px-6 py-3 rounded-full bg-secondary text-white font-cairo font-bold text-sm hover:bg-secondary/90 transition-transform active:scale-95 shadow-md flex items-center justify-center gap-2">
                <span>🌹</span>
                <span>الرجوع لوسط الحديقة 360°</span>
            </button>
            <div class="flex items-center gap-2">
                <button onclick="stepToPrevGate()" class="px-4 py-2 rounded-full bg-primary-container/60 text-secondary font-cairo font-bold text-xs hover:bg-primary-container">السنة السابقة</button>
                <button onclick="stepToNextGate()" class="px-4 py-2 rounded-full bg-primary-container/60 text-secondary font-cairo font-bold text-xs hover:bg-primary-container">السنة التالية</button>
            </div>
        </div>

    </div>
</div>

<script src="shared.js"></script>
</body>
</html>
